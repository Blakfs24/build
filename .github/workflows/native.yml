name: Public native manifest build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private repository branch, tag, or commit
        required: true
        default: dev-next
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.38.10'

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    with:
      source_ref: ${{ inputs.source_ref }}
    secrets:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

  native:
    needs: tests
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: android-arm, os: ubuntu-22.04}
          - {target: android-arm64, os: ubuntu-22.04}
          - {target: android-amd64, os: ubuntu-22.04}
          - {target: windows-amd64, os: windows-2022}
          - {target: linux-amd64-glibc, os: ubuntu-22.04}
          - {target: macos-amd64, os: macos-15-intel}
          - {target: macos-arm64, os: macos-15}

    steps:
      - name: Configure Windows build paths
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')
          $parent = Split-Path -Parent $workspace
          $leaf = Split-Path -Leaf $workspace
          subst S: "$parent"
          "SHORT_WORKSPACE=S:/$leaf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: ${{ needs.tests.outputs.source_sha }}
          submodules: recursive

      - name: Resolve Go version
        id: go
        shell: bash
        run: |
          version="$(awk '$1 == "go" { print $2; exit }' libcore/go.mod)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: libcore/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Java
        if: startsWith(matrix.target, 'android-')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Android SDK and NDK versions
        if: startsWith(matrix.target, 'android-')
        id: android
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          targets = json.loads(Path('native/targets.json').read_text())['targets']
          target = targets[os.environ['NATIVE_TARGET']]
          native_api = int(target['android_api'])
          # APKs require Android 7.0; compileSdk still follows Flutter.
          minimum_api = max(24, native_api)
          extension = Path(os.environ['FLUTTER_ROOT']) / 'packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt'
          source = extension.read_text()
          compile_sdk = re.search(r'\bcompileSdkVersion\s*:\s*Int\s*=\s*(\d+)', source)
          ndk = re.search(r'\bndkVersion\s*:\s*String\s*=\s*"([^"]+)"', source)
          if compile_sdk is None or ndk is None:
              raise SystemExit('Cannot resolve Android toolchain versions from the selected Flutter SDK')
          if int(compile_sdk[1]) < minimum_api:
              raise SystemExit('Flutter compileSdk is lower than the required Android API')
          triple = {
              'armeabi-v7a': 'armv7a-linux-androideabi',
              'arm64-v8a': 'aarch64-linux-android',
              'x86_64': 'x86_64-linux-android',
          }[target['android_abi']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'minimum_api={minimum_api}\n')
              output.write(f'compile_sdk={compile_sdk[1]}\n')
              output.write(f'ndk_version={ndk[1]}\n')
              output.write(f'compiler_prefix={triple}{native_api}\n')
          PYTHON

      - name: Install Android SDK and NDK
        if: startsWith(matrix.target, 'android-')
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ steps.android.outputs.minimum_api }}
            platforms;android-${{ steps.android.outputs.compile_sdk }}
            ndk;${{ steps.android.outputs.ndk_version }}

      - name: Select and verify Android NDK
        if: startsWith(matrix.target, 'android-')
        shell: bash
        env:
          NDK_VERSION: ${{ steps.android.outputs.ndk_version }}
          NDK_COMPILER_PREFIX: ${{ steps.android.outputs.compiler_prefix }}
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk_root/ndk/$NDK_VERSION"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -f "$ndk/source.properties"
          test -x "$toolchain/$NDK_COMPILER_PREFIX-clang"
          test -x "$toolchain/$NDK_COMPILER_PREFIX-clang++"
          echo "ANDROID_NDK=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Install Windows toolchain
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          choco install -y --no-progress make mingw cmake ninja pkgconfiglite
          Add-Content $env:GITHUB_ENV 'CC_WINDOWS_AMD64=gcc'
          Add-Content $env:GITHUB_ENV 'CXX_WINDOWS_AMD64=g++'

      - name: Install Linux build dependencies
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: make setup-linux

      - name: Resolve Dart dependencies
        shell: bash
        run: flutter pub get --enforce-lockfile

      - name: Build native manifest
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then cd "$SHORT_WORKSPACE"; fi
          dart tool/native_build.dart build --target ${{ matrix.target }} --profile release

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/native/${{ matrix.target }}/release
          if-no-files-found: error
