name: Public native manifest build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private repository branch, tag, or commit
        required: true
        default: dev-next
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.38.10'

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: android-arm, os: ubuntu-22.04}
          - {target: android-arm64, os: ubuntu-22.04}
          - {target: android-amd64, os: ubuntu-22.04}
          - {target: windows-amd64, os: windows-2022}
          - {target: linux-amd64-glibc, os: ubuntu-22.04}
          - {target: macos-amd64, os: macos-15-intel}
          - {target: macos-arm64, os: macos-15}

    steps:
      - name: Configure Windows build paths
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')
          $parent = Split-Path -Parent $workspace
          $leaf = Split-Path -Leaf $workspace
          subst S: "$parent"
          "SHORT_WORKSPACE=S:/$leaf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Resolve Go version
        id: go
        shell: bash
        run: |
          version="$(awk '$1 == "go" { print $2; exit }' libcore/go.mod)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: libcore/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Java
        if: startsWith(matrix.target, 'android-')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: startsWith(matrix.target, 'android-')
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Select Android NDK
        if: startsWith(matrix.target, 'android-')
        shell: bash
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            ndk="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Install Windows toolchain
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          choco install -y --no-progress make mingw cmake ninja pkgconfiglite
          Add-Content $env:GITHUB_ENV 'CC_WINDOWS_AMD64=gcc'
          Add-Content $env:GITHUB_ENV 'CXX_WINDOWS_AMD64=g++'

      - name: Install Linux build dependencies
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: make setup-linux

      - name: Resolve Dart dependencies
        shell: bash
        run: flutter pub get --enforce-lockfile

      - name: Build native manifest
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then cd "$SHORT_WORKSPACE"; fi
          dart tool/native_build.dart build --target ${{ matrix.target }} --profile release

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/native/${{ matrix.target }}/release
          if-no-files-found: error
