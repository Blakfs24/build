name: Public pre-release build

on:
  repository_dispatch:
    types: [build-trigger]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private repository branch, tag, or commit
        required: true
        default: dev-next
        type: string

permissions:
  contents: write

concurrency:
  group: public-build-${{ github.event.client_payload.sha || inputs.source_ref }}
  cancel-in-progress: true

jobs:
  packages:
    uses: ./.github/workflows/package.yml
    with:
      source_ref: ${{ github.event.client_payload.sha || inputs.source_ref }}
      app_environment: release
      require_android_signing: false
    secrets: inherit

  publish:
    name: Update public pre-release
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          for directory in dist/package-*; do
            [ -d "$directory" ] || continue
            suffix="${directory##*/package-}"
            while IFS= read -r file; do
              filename="$(basename "$file")"
              stem="${filename%.*}"
              extension="${filename##*.}"
              cp "$file" "release-assets/${stem}-${suffix}.${extension}"
            done < <(find "$directory" -type f ! -path '*/native/*' \( -name '*.apk' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.dmg' \))
          done
          while IFS= read -r manifest; do
            target="$(jq -r '.target' "$manifest")"
            profile="$(jq -r '.profile' "$manifest")"
            test -n "$target"
            cp "$manifest" "release-assets/${target}-${profile}-manifest.json"
          done < <(find dist -path '*/native/*/*/manifest.json' -type f)

      - name: Replace pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete pre-release --cleanup-tag --yes 2>/dev/null || true

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-release
          name: Pre-Release
          prerelease: true
          generate_release_notes: false
          body: |
            Source revision: `${{ github.event.client_payload.sha || inputs.source_ref }}`
            Build run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: release-assets/*
